<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль — Мой сад</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#4caf50">
</head>
<body class="theme-green">
    <div class="container">
        <h1>🌿 Мой сад</h1>
        <p class="subtitle">Придумай новый пароль</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="ai-tip" style="background: #ffcdd2; color: #b71c1c;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="profile-form">
            <label>Новый пароль:
                <input type="password" name="new_password" required minlength="4" placeholder="Минимум 4 символа">
            </label>
            <button type="submit" class="btn-primary">Сохранить новый пароль</button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            <a href="/login" style="color: var(--primary);">← Вернуться ко входу</a>
        </p>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
